<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мужчынскія песні — Федароўскі, т. V–VI (версія для друку)</title>
<style>
:root { --ink: #1d1914; --muted: #6b6258; --line: #d9d1c5; --accent: #b3261e; --ref: #8d3a2a; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font-family: "Noto Serif", "PT Serif", Cambria, Georgia, "Times New Roman", serif; font-size: 11pt; line-height: 1.4; }
.wrap { max-width: 180mm; margin: 0 auto; padding: 10mm 0; }
@page { size: A4; margin: 14mm 15mm 16mm; @bottom-center { content: counter(page); font-family: "Segoe UI", Arial, sans-serif; font-size: 9pt; color: #6b6258; } }
@media screen { .wrap { padding: 24px 16px; } }
.sans { font-family: "Segoe UI", "Noto Sans", Roboto, Arial, sans-serif; }
.cover { text-align: center; padding-top: 50mm; break-after: page; }
.cover h1 { font-size: 30pt; line-height: 1.15; margin: 0 0 6mm; }
.cover .sub { font-size: 13pt; color: var(--muted); margin-bottom: 18mm; }
.cover .note { text-align: left; font-size: 10.5pt; max-width: 140mm; margin: 0 auto; color: #333; }
.cover .note p { margin: 0 0 3mm; }
.stats { display: flex; justify-content: center; gap: 10mm; margin: 0 0 14mm; }
.stats div { font-size: 9.5pt; color: var(--muted); }
.stats b { display: block; font-size: 20pt; color: var(--ink); }
h2.part { font-size: 18pt; margin: 0 0 5mm; padding-bottom: 2mm; border-bottom: 1.5px solid var(--accent); break-before: page; color: var(--accent); }
.orn { display: block; width: 100%; height: 22px; color: #c62828; }
.cover .orn { margin: 0 auto 12mm; width: 150mm; }
.cover .orn.b { margin: 12mm auto 0; transform: scaleY(-1); }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.toc { columns: 2; column-gap: 8mm; font-size: 9pt; line-height: 1.35; }
.toc a { display: block; color: var(--ink); text-decoration: none; break-inside: avoid; padding: .2mm 0; }
.toc a b { color: var(--accent); font-weight: 600; display: inline-block; min-width: 11mm; }
.toc h3 { font-size: 10.5pt; margin: 0 0 2mm; column-span: all; }
.toc + .toc { margin-top: 6mm; }
.song { break-inside: avoid; padding: 5mm 0 4mm; border-bottom: 1px solid var(--line); }
.song.long { break-inside: auto; }
.song h3 { font-size: 14pt; margin: 0 0 1mm; line-height: 1.25; break-after: avoid; }
.song h3 .no { color: var(--accent); margin-right: 2.5mm; }
.meta { font-size: 8.5pt; color: var(--muted); margin-bottom: 2.5mm; line-height: 1.35; break-after: avoid; }
.meta i { color: #8a8076; }
.sheet { margin: 1.5mm 0 1mm; break-inside: avoid; }
.sheet img { display: block; width: 100%; height: auto; }
.cap { font-size: 8pt; color: var(--muted); margin-bottom: 2mm; }
.cap.ref { color: var(--ref); }
.text { margin-top: 2mm; }
.text.cols { columns: 2; column-gap: 8mm; }
.ln { padding-left: 1.2em; text-indent: -1.2em; break-inside: avoid; }
.rep { color: var(--muted); font-size: .85em; }
.pl { font-size: 8.5pt; color: var(--muted); font-style: italic; margin-top: 1.5mm; }
.fn { margin-top: 2mm; font-size: 8pt; color: var(--muted); }
.fn span { display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="orn" width="34" height="14" patternUnits="userSpaceOnUse" patternTransform="scale(1.5)"><g fill="#c62828"><rect x="16" y="0" width="2" height="2"/><rect x="14" y="2" width="2" height="2"/><rect x="18" y="2" width="2" height="2"/><rect x="12" y="4" width="2" height="2"/><rect x="16" y="4" width="2" height="2"/><rect x="20" y="4" width="2" height="2"/><rect x="10" y="6" width="2" height="2"/><rect x="14" y="6" width="6" height="2"/><rect x="22" y="6" width="2" height="2"/><rect x="12" y="8" width="2" height="2"/><rect x="16" y="8" width="2" height="2"/><rect x="20" y="8" width="2" height="2"/><rect x="14" y="10" width="2" height="2"/><rect x="18" y="10" width="2" height="2"/><rect x="16" y="12" width="2" height="2"/><rect x="0" y="6" width="6" height="2"/><rect x="28" y="6" width="6" height="2"/><rect x="2" y="4" width="2" height="2"/><rect x="2" y="8" width="2" height="2"/><rect x="30" y="4" width="2" height="2"/><rect x="30" y="8" width="2" height="2"/></g></pattern></defs></svg>
<div class="wrap" id="root"></div>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var S = (window.SONGS || []).slice().sort(function (a, b) { return (a.n - b.n) || (a.id < b.id ? -1 : 1); });
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var music = S.filter(function (s) { return s.group !== 'none'; });
  var none = S.filter(function (s) { return s.group === 'none'; });
  var byId = {}; S.forEach(function (s) { byId[s.id] = s; });
  function line(t) {
    return esc(t).replace(/\((\d) (р|r)\.\)/g, '<span class="rep">($1 $2.)</span>').replace(/(і г\.д\.|itd\.)/g, '<span class="rep">$1</span>').replace(/\((як вышэй|jw\.)\)/g, '<span class="rep">($1)</span>');
  }
  function song(s) {
    var lines = s.lang === 'pl' ? s.lat : s.cyr;
    var h = [];
    var long = lines.length > 40 || (s.own.length + s.refm.length > 2);
    h.push('<section class="song' + (long ? ' long' : '') + '" id="s-' + esc(s.id) + '">');
    h.push('<h3><span class="no">№ ' + esc(s.id) + '</span>' + esc(s.title) + '</h3>');
    var m = [esc(s.part) + ' › ' + esc(s.chapter), esc(s.cat)];
    m.push((s.region ? esc(s.region) + ' ' : '') + '<i>(' + esc(s.header) + ')</i>');
    if (s.informant.length) m.push('выкон.: ' + s.informant.map(function (x, i) { return esc(s.informant_cyr[i]); }).join(', '));
    if ((s.tempo_by || []).length) m.push('тэмп: ' + esc(s.tempo_by.join(', ')) + ' <i>(' + esc(s.tempo_lat.join('; ')) + ')</i>');
    if (s.melref && !s.refm.length) m.push('мелодыя: <i>' + esc(s.melref) + '</i>');
    if (s.dance) m.push('танец: ' + esc(s.dance));
    m.push('т. ' + esc(s.vol || 'V') + ', с. ' + esc(s.page));
    h.push('<div class="meta sans">' + m.join(' · ') + '</div>');
    s.own.forEach(function (im) { h.push('<div class="sheet"><img src="' + esc(im.src) + '" alt=""></div>'); });
    s.refm.forEach(function (r) {
      if (!r.imgs.length) return;
      var inSet = byId[r.n] || byId[r.n + 'a'];
      h.push('<div class="cap ref sans">Спяваецца на мелодыю № ' + esc(r.n) + ' (т. ' + esc(r.vol) + ', с. ' + esc(r.imgs[0].page) + ')' + (inSet ? ' — гл. таксама № ' + esc(r.n) + ' у гэтым зборніку' : '; словы пад нотамі — з той песні') + ':</div>');
      r.imgs.forEach(function (im) { h.push('<div class="sheet"><img src="' + esc(im.src) + '" alt=""></div>'); });
    });
    h.push('<div class="text' + (lines.length > 14 ? ' cols' : '') + '">' + lines.map(function (l) { return '<div class="ln">' + (l.trim() ? line(l) : '&nbsp;') + '</div>'; }).join('') + '</div>');
    if (s.lang === 'pl') h.push('<div class="pl sans">Запісана Федароўскім па-польску — тэкст у арыгінале.</div>');
    if (s.footnotes.length) h.push('<div class="fn sans">' + s.footnotes.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('') + '</div>');
    h.push('</section>');
    return h.join('');
  }
  function toc(list, title) {
    return '<div class="toc sans"><h3>' + title + ' (' + list.length + ')</h3>' + list.map(function (s) { return '<a href="#s-' + esc(s.id) + '"><b>' + esc(s.id) + '</b>' + esc(s.title) + '</a>'; }).join('') + '</div>';
  }
  var own = S.filter(function (s) { return s.group === 'own'; }).length;
  var html = [];
  html.push('<div class="cover"><svg class="orn"><rect width="100%" height="100%" fill="url(#orn)"/></svg><h1>Мужчынскія песні</h1><div class="sub">з V і VI тамоў зборніка Міхала Федароўскага<br><i>Lud białoruski na Rusi Litewskiej</i></div>' +
    '<div class="stats sans"><div><b>' + S.length + '</b>песень</div><div><b>' + own + '</b>з нотамі</div><div><b>' + (music.length - own) + '</b>з нотамі мелодыі<br>паводле спасылкі</div><div><b>' + none.length + '</b>без нот</div></div>' +
    '<div class="note sans"><p>Нумары песень — паводле выдання. Тэкст пераведзены з польскай лацінкі Федароўскага ў беларускую кірыліцу з захаваннем дыялектнага вымаўлення і націскаў; песні, запісаныя па-польску, пададзены ў арыгінале. Ноты выразаныя са сканаў выдання; калі ў выданні пазначана «na mel. nr …», ноты той мелодыі пастаўлены проста пры песні. Тэкст выдання распазнаваўся аўтаматычна, таму асобныя словы могуць быць скажоныя — арыгінальны запіс можна паглядзець у HTML-версіі (index.html).</p>' +
    '<p>Дробным шрыфтам пад песнямі — зноскі выдання па-польску («v.» — варыянт радка). Мелодыі можна праслухаць у HTML-версіі (index.html).</p></div><svg class="orn b"><rect width="100%" height="100%" fill="url(#orn)"/></svg></div>');
  html.push('<h2 class="part sans" style="break-before:auto">Змест</h2>' + toc(music, 'I. Песні з нотамі') + toc(none, 'II. Песні без нот'));
  html.push('<h2 class="part sans">I. Песні з нотамі</h2>' + music.map(song).join(''));
  html.push('<h2 class="part sans">II. Песні без нот</h2>' + none.map(song).join(''));
  document.getElementById('root').innerHTML = html.join('');
})();
</script>
</body>
</html>
