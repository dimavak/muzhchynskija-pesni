<title>Мужчынскія песні — Федароўскі, т. V–VI</title>
<meta name="description" content="845 мужчынскіх песень з V і VI тамоў «Lud białoruski na Rusi Litewskiej» Міхала Федароўскага: тэксты кірыліцай і ў арыгінале, ноты і мелодыі для праслухоўвання.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)">

<style>
/* =====================================================================
   Tokens. Light: white linen, crimson and black thread of a vyshyvanka.
   Dark: Material night with the same thread, lightened for contrast.
   ===================================================================== */
:root {
  --page: #ffffff; --linen: #f4f2ef; --linen-2: #ebe7e3; --paper: #ffffff;
  --ink: #1c1918; --ink-2: #5d5552; --ink-3: #736965; --rule: #e3ddd8; --rule-2: #cfc6c0;
  --thread: #b0141e; --thread-ink: #ffffff; --thread-soft: #fbe5e4; --thread-wash: #fdf2f1; --on-soft: #6f0b12;
  --ornament: #b0141e; --ornament-2: #1c1918;
  --hover: rgba(176, 20, 30, .06); --press: rgba(176, 20, 30, .12);
  --cursor: #c8102e; --cursor-band: rgba(200, 16, 46, .10); --own: #2e7d32;
  --shadow: 0 1px 2px rgba(40, 10, 10, .08), 0 6px 18px -8px rgba(40, 10, 10, .18);
  --serif: Alegreya, "PT Serif", Georgia, serif;
  --sans: "Alegreya Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --fs: 20px; --rail: 320px; --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #151213; --linen: #1c1819; --linen-2: #262021; --paper: #f6f1ec;
    --ink: #eee6e2; --ink-2: #bdb2ad; --ink-3: #958985; --rule: #332b2b; --rule-2: #463c3b;
    --thread: #ff8f93; --thread-ink: #3b0006; --thread-soft: #4a1d20; --thread-wash: #241a1b; --on-soft: #ffd9d8;
    --ornament: #c3313b; --ornament-2: #eee6e2;
    --hover: rgba(255, 143, 147, .08); --press: rgba(255, 143, 147, .14);
    --cursor: #c8102e; --cursor-band: rgba(200, 16, 46, .12); --own: #7fcf8c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #151213; --linen: #1c1819; --linen-2: #262021; --paper: #f6f1ec;
  --ink: #eee6e2; --ink-2: #bdb2ad; --ink-3: #958985; --rule: #332b2b; --rule-2: #463c3b;
  --thread: #ff8f93; --thread-ink: #3b0006; --thread-soft: #4a1d20; --thread-wash: #241a1b; --on-soft: #ffd9d8;
  --ornament: #c3313b; --ornament-2: #eee6e2;
  --hover: rgba(255, 143, 147, .08); --press: rgba(255, 143, 147, .14);
  --cursor: #c8102e; --cursor-band: rgba(200, 16, 46, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--thread-soft); color: var(--on-soft); }
a { color: var(--thread); text-underline-offset: .18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--thread); color: var(--thread-ink); padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 500; }
.skip:focus { top: 12px; }
h1, h2, h3 { text-wrap: balance; }
[hidden] { display: none !important; }
.num { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
.mast { background: var(--page); border-bottom: 1px solid var(--rule); position: relative; z-index: 5; }
.band { display: block; width: 100%; height: 21px; color: var(--ornament); }
.mast-in { display: flex; align-items: center; gap: 8px; padding: 8px max(14px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left)); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); min-width: 0; padding: 4px 8px 4px 4px; border-radius: 8px; }
.brand:hover { background: var(--hover); }
.brand svg { width: 34px; height: 34px; color: var(--ornament); flex: none; }
.brand b { display: block; font: 700 22px/1.1 var(--serif); letter-spacing: -.005em; }
.brand small { display: block; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; flex: none; transition: background-color .15s, color .15s; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { background: var(--press); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.layout { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 0; }

/* ---------- rail: search, filters, list ---------- */
.rail { background: var(--linen); border-right: 1px solid var(--rule); min-height: 0; display: flex; flex-direction: column; }
.rail-scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1; scrollbar-color: var(--rule-2) transparent; scrollbar-width: thin; }
.rail-top { position: sticky; top: 0; z-index: 2; background: var(--linen); padding: 14px 14px 10px; }
.search { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 4px 0 14px; border-radius: 23px; background: var(--page); border: 1px solid var(--rule-2); color: var(--ink-3); }
.search:focus-within { border-color: var(--thread); box-shadow: 0 0 0 1px var(--thread); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 16px; height: 100%; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.filters { padding: 0 14px 6px; display: grid; gap: 10px; }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule-2); border-radius: var(--r); overflow: hidden; background: var(--page); }
.groups button { border: 0; border-right: 1px solid var(--rule-2); background: transparent; padding: 6px 4px; min-height: 48px; display: grid; align-content: center; justify-items: center; gap: 0; line-height: 1.15; transition: background-color .15s; }
.groups button:last-child { border-right: 0; }
.groups button span { font-size: 15px; font-weight: 500; }
.groups button small { font-size: 13px; color: var(--ink-3); }
.groups button:hover { background: var(--hover); }
.groups button[aria-pressed="true"] { background: var(--thread); color: var(--thread-ink); }
.groups button[aria-pressed="true"] small { color: inherit; opacity: .85; }
.facets { display: grid; gap: 8px; }
.facet { border: 1px solid var(--rule-2); border-radius: var(--r); background: var(--page); min-width: 0; }
.facet summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 8px 0 12px; cursor: pointer; border-radius: var(--r); }
.facet summary::-webkit-details-marker { display: none; }
.facet summary:hover { background: var(--hover); }
.facet summary .lbl { color: var(--ink-2); flex: none; }
.facet summary b { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.facet .chev { width: 22px; height: 22px; fill: currentColor; color: var(--ink-3); transition: transform .2s; flex: none; }
.facet[open] .chev { transform: rotate(180deg); }
.facet .clear { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; color: var(--ink-3); flex: none; }
.facet .clear:hover { background: var(--press); color: var(--ink); }
.facet .clear svg { width: 17px; height: 17px; fill: currentColor; }
.fsearch { display: block; padding: 2px 10px 8px; }
.fsearch input { width: 100%; height: 38px; border: 1px solid var(--rule-2); border-radius: 8px; padding: 0 10px; background: var(--linen); color: var(--ink); font-size: 15px; outline: none; }
.fsearch input:focus { border-color: var(--thread); }
.opts { max-height: min(340px, 50vh); overflow-y: auto; overscroll-behavior: contain; padding: 0 6px 8px; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.opt { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 10px; text-align: left; border: 0; background: transparent; padding: 7px 8px; min-height: 38px; border-radius: 6px; font-size: 15.5px; color: var(--ink); transition: background-color .15s; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.parent { font-weight: 500; margin-top: 4px; }
.opt.sub { padding-left: 24px; font-size: 15px; color: var(--ink-2); }
.opt small { color: var(--ink-3); font-weight: 400; flex: none; }
.opt:hover { background: var(--hover); }
.opt[aria-pressed="true"] { background: var(--thread-soft); color: var(--on-soft); }
.opt[aria-pressed="true"] small { color: inherit; }
.opts .none { color: var(--ink-3); padding: 6px 8px; margin: 0; }
.reset { justify-self: start; border: 0; background: transparent; color: var(--thread); padding: 6px 2px; font-size: 15px; text-decoration: underline; text-underline-offset: .2em; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 22px 0; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.ic { width: 17px; height: 17px; flex: none; }
.ic.own { fill: var(--own); }
.ic.ref { fill: var(--thread); }
.flink { border: 0; background: transparent; padding: 0; color: var(--thread); text-align: left; font: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; cursor: pointer; }
.flink:hover { text-decoration-thickness: 2px; }
.crumbbar .grow { flex: 1; }
.print-src, .print-url { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 12px; }
.chip { border: 1px solid var(--rule-2); background: transparent; border-radius: 8px; min-height: 36px; padding: 4px 10px; font-size: 15px; text-align: left; color: var(--ink); transition: background-color .15s, border-color .15s; max-width: 100%; }
.chip small { color: var(--ink-3); margin-left: 4px; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--thread-soft); border-color: transparent; color: var(--on-soft); font-weight: 500; }
.chip[aria-pressed="true"] small { color: inherit; }
.list { padding: 4px 8px 32px; }
.ghead { margin: 14px 10px 4px; font: 500 15px/1.3 var(--sans); color: var(--thread); display: flex; align-items: center; gap: 10px; }
.ghead::after { content: ""; flex: 1; height: 1px; background: var(--rule-2); }
.item { display: grid; grid-template-columns: 46px minmax(0, 1fr) 20px; align-items: center; gap: 2px; min-height: 44px; padding: 3px 10px 3px 4px; border-radius: 8px; text-decoration: none; color: var(--ink); content-visibility: auto; contain-intrinsic-size: auto 44px; }
.item:hover { background: var(--hover); }
.item[aria-current="page"] { background: var(--thread-soft); color: var(--on-soft); }
.item .n { font-size: 14px; color: var(--ink-3); text-align: right; padding-right: 10px; }
.item[aria-current="page"] .n { color: inherit; }
.item .t { font: 17px/1.25 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .ic { width: 17px; height: 17px; }
.empty { padding: 24px 12px; color: var(--ink-2); text-align: center; }
.empty button { margin-top: 8px; }

/* ---------- document ---------- */
.doc { overflow-y: auto; min-width: 0; scroll-behavior: smooth; outline: none; scrollbar-color: var(--rule-2) transparent; }
.page { max-width: 1120px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 48px) 72px; }
.crumbbar { display: flex; align-items: center; gap: 4px; margin: 0 0 6px -10px; color: var(--ink-2); font-size: 15px; }
.opener { display: block; width: 136px; height: 14px; color: var(--ornament); margin: 10px 0 14px; }
.song-title { margin: 0 0 6px; font: 700 clamp(30px, 3.6vw, 44px)/1.08 var(--serif); letter-spacing: -.012em; }
.song-title .no { color: var(--thread); font-weight: 500; margin-right: .35em; white-space: nowrap; }
.song-title .no small { font-size: .55em; margin-right: .12em; vertical-align: .22em; }
.subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 22px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px; border-radius: 16px; border: 1px solid var(--rule-2); background: transparent; font-size: 15px; color: var(--ink-2); text-decoration: none; }
button.pill:hover, a.pill:hover { background: var(--hover); color: var(--ink); }
.pill svg { width: 16px; height: 16px; fill: var(--thread); }
.pill svg.own { fill: var(--own); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: 0 48px; align-items: start; }
.score-sec { max-width: 1040px; }
.main-col { min-width: 0; }
.sec { margin: 0 0 34px; scroll-margin-top: 16px; }
.sec-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 14px; }
.sec-h h2 { margin: 0; font: 700 22px/1.2 var(--serif); }
.sec-h .grow { flex: 1; }

/* apparatus: the record's details in the margin, like a scholarly edition */
.apparatus { position: sticky; top: 16px; border-left: 1px solid var(--rule); padding-left: 22px; font-size: 15.5px; color: var(--ink-2); }
.apparatus dl { margin: 0; display: grid; gap: 12px; }
.apparatus dt { font-weight: 500; color: var(--ink); font-size: 14.5px; }
.apparatus dd { margin: 2px 0 0; }
.apparatus .orig { font-style: italic; color: var(--ink-3); }
.apparatus h3 { margin: 22px 0 6px; font: 500 14.5px/1.3 var(--sans); color: var(--ink); }
.apparatus ol { margin: 0; padding-left: 18px; }
.apparatus li { margin: 4px 0; }
.apparatus .fn-note { font-size: 13.5px; color: var(--ink-3); margin: 0 0 6px; }

/* ---------- score: sheets on paper and the player ---------- */
.score { background: var(--paper); border-radius: 14px; border: 1px solid var(--rule); box-shadow: var(--shadow); overflow: hidden; }
.sheets { padding: 14px 14px 4px; }
.sheet { margin: 0 0 10px; position: relative; }
.sheet-img { position: relative; cursor: pointer; }
.sheet-img img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.zoom-btn { position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #e3ddd8; background: rgba(255, 255, 255, .92); color: #4a4241; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.sheet:hover .zoom-btn, .zoom-btn:focus-visible { opacity: 1; }
.zoom-btn svg { width: 20px; height: 20px; fill: currentColor; }
.cur-band { position: absolute; width: 2.6%; transform: translateX(-50%); background: var(--cursor-band); border-radius: 6px; pointer-events: none; display: none; }
.cur-dot { position: absolute; width: 2%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2.5px solid var(--cursor); box-shadow: 0 0 0 4px rgba(200, 16, 46, .16); pointer-events: none; display: none; }
.playing .cur-band, .playing .cur-dot, .paused .cur-band, .paused .cur-dot { display: block; }
.cap { margin: 0 14px 12px; font-size: 14px; color: #6a615d; }
.refnote { margin: 0 14px 10px; padding: 10px 12px; background: #f7f3f0; border-radius: 8px; font-size: 15px; color: #3d3533; }
.refnote a { color: #9b111b; }
.refnote small { display: block; color: #6a615d; margin-top: 2px; }
.player { padding: 12px 14px 14px; border-top: 1px solid #ece6e1; background: #faf7f5; color: #2a2423; }
.p-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.p-row .track { flex: 1 1 220px; }
.pbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: 1px solid #d9d1cb; background: #fff; color: #2a2423; font: 500 16px/1 var(--sans); transition: background-color .15s, border-color .15s; }
.pbtn svg { width: 22px; height: 22px; fill: currentColor; }
.pbtn:hover { background: rgba(176, 20, 30, .06); }
.pbtn.main { background: #b0141e; border-color: #b0141e; color: #fff; box-shadow: 0 2px 6px rgba(120, 10, 20, .25); }
.pbtn.main:hover { background: #950f18; }
.pbtn:not(.main)[aria-pressed="true"] { background: #fbe5e4; color: #6f0b12; border-color: transparent; }
.pbtn.ghost { border-color: transparent; background: transparent; }
.pbtn.ghost:hover, .pbtn.ghost[aria-expanded="true"] { background: #f1ebe8; }
.p-panel { display: grid; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ece6e1; }
.p-panel[hidden] { display: none; }
.p-field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.p-lbl { min-width: 96px; font-size: 15px; color: #5a5250; }
.p-field small { color: #6a615d; font-size: 14px; }
.p-field output { min-width: 64px; font-size: 14.5px; }
#pTempo { flex: 0 1 240px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; color: #3d3533; }
.switch input { -webkit-appearance: none; appearance: none; width: 44px; height: 26px; border-radius: 13px; background: #d9d1cb; position: relative; margin: 0; flex: none; cursor: pointer; transition: background-color .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch input:checked { background: #b0141e; }
.switch input:checked::after { transform: translateX(18px); }
.switch input:focus-visible { outline: 2px solid #b0141e; outline-offset: 2px; }
.switch.off { cursor: default; opacity: .55; }
.switch.off input { cursor: default; }
#pInst { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; max-width: 460px; border-radius: 14px; }
#pInst button { border-bottom: 1px solid #d9d1cb; min-height: 40px; padding: 4px 8px; line-height: 1.2; text-align: center; }
#pInst button:nth-child(3n) { border-right: 0; }
#pInst button:nth-last-child(-n+3) { border-bottom: 0; }

.track { display: flex; align-items: center; gap: 12px; min-width: 0; }
.time { font-size: 14px; color: #6a615d; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid #d9d1cb; border-radius: 18px; overflow: hidden; background: #fff; }
.seg button { border: 0; border-right: 1px solid #d9d1cb; background: transparent; min-height: 34px; padding: 0 12px; font-size: 14.5px; color: #2a2423; transition: background-color .15s; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: rgba(176, 20, 30, .06); }
.seg button[aria-pressed="true"] { background: #fbe5e4; color: #6f0b12; font-weight: 500; }
.stepper { display: inline-flex; align-items: center; border: 1px solid #d9d1cb; border-radius: 18px; background: #fff; min-height: 36px; }
.stepper button { width: 36px; height: 34px; border: 0; background: transparent; display: grid; place-items: center; border-radius: 17px; color: #2a2423; }
.stepper button:hover { background: rgba(176, 20, 30, .06); }
.stepper button svg { width: 18px; height: 18px; fill: currentColor; }
.stepper output { min-width: 62px; text-align: center; font-size: 14.5px; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #d9d1cb; background: #fff; font-size: 14.5px; color: #2a2423; transition: background-color .15s; }
.tbtn:hover { background: rgba(176, 20, 30, .06); }
.tbtn[aria-pressed="true"] { background: #fbe5e4; color: #6f0b12; border-color: transparent; }
.tbtn svg { width: 18px; height: 18px; fill: currentColor; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 80px; height: 28px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, #b0141e var(--p, 0%), #ddd5cf var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #ddd5cf; }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: #b0141e; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #b0141e; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #b0141e; border: 2px solid #fff; }
.pnote { margin: 0; padding: 0 14px 14px; background: #faf7f5; font-size: 14px; color: #6a615d; }
kbd { font: 500 13px var(--sans); border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--page); color: var(--ink); }
.pnote kbd { background: #fff; color: #2a2423; border-color: #d9d1cb; }

/* ---------- lyrics ---------- */
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; }
.lyr .seg, .lyr .tbtn, .lyr .stepper { background: var(--page); border-color: var(--rule-2); color: var(--ink); }
.lyr .seg button { color: var(--ink); border-color: var(--rule-2); }
.lyr .seg button:hover, .lyr .tbtn:hover, .lyr .stepper button:hover { background: var(--hover); }
.lyr .seg button[aria-pressed="true"], .lyr .tbtn[aria-pressed="true"] { background: var(--thread-soft); color: var(--on-soft); }
.lyr .stepper button { color: var(--ink); }
.text { font: 400 var(--fs)/1.62 var(--serif); max-width: 36em; }
.cols { display: grid; gap: 28px; }
.cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols h3 { margin: 0 0 8px; font: 500 15px/1.3 var(--sans); color: var(--ink-2); }
.ln { padding-left: 1.3em; text-indent: -1.3em; }
.ln .rep { font: 400 .74em var(--sans); color: var(--ink-3); }
.lat .ln { color: var(--ink-2); }
.cols.one .lat .ln { color: var(--ink); }
.notice { background: var(--thread-wash); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; color: var(--ink); font-size: 16px; }

/* ---------- likes (giscus) ---------- */
.likes p { margin: 0 0 12px; color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
.likes .giscus { min-height: 120px; }

/* ---------- pager ---------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; padding-top: 22px; border-top: 1px solid var(--rule); }
.pager a { display: block; text-decoration: none; color: var(--ink); padding: 10px 14px; border-radius: 10px; min-width: 0; transition: background-color .15s; }
.pager a:hover { background: var(--hover); }
.pager small { display: block; color: var(--thread); font-size: 14.5px; }
.pager span { display: block; font: 18px/1.3 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .nx { text-align: right; grid-column: 2; }

/* ---------- home ---------- */
.home { max-width: 820px; }
.home .band-lg { display: block; width: 100%; height: 30px; color: var(--ornament); margin: 6px 0 22px; }
.home h1 { font: 800 clamp(40px, 6vw, 68px)/1.02 var(--serif); letter-spacing: -.02em; margin: 0 0 18px; }
.lead { font: 400 clamp(19px, 2vw, 22px)/1.5 var(--serif); color: var(--ink); max-width: 38em; margin: 0 0 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 40px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 23px; text-decoration: none; font-weight: 500; font-size: 16.5px; border: 1px solid transparent; transition: background-color .15s, border-color .15s; }
.btn.primary { background: var(--thread); color: var(--thread-ink); }
.btn.primary:hover { filter: brightness(.94); }
.btn.quiet { border-color: var(--rule-2); color: var(--ink); }
.btn.quiet:hover { background: var(--hover); }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.home h2 { font: 700 24px/1.2 var(--serif); margin: 34px 0 12px; }
.home p { max-width: 62ch; color: var(--ink-2); }
.cats { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 28px; }
.cats li { border-bottom: 1px solid var(--rule); }
.cats button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 4px; text-align: left; font: 18px/1.3 var(--serif); color: var(--ink); transition: background-color .15s; }
.cats button:hover { background: var(--hover); }
.cats button span:last-child { font: 15px var(--sans); color: var(--ink-3); }
.cats.vols { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.cats small { display: block; margin-top: 3px; font: 14px/1.4 var(--sans); color: var(--ink-3); }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; color: var(--ink-2); margin: 0; }
.keys dd { margin: 0; }

/* ---------- overlays ---------- */
dialog.zoom { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 56px 16px 24px; border: 0; background: rgba(18, 12, 12, .9); overflow: auto; overscroll-behavior: contain; }
dialog.zoom::backdrop { background: transparent; }
dialog.zoom img { display: block; margin: 0 auto; width: min(1700px, 170vw); max-width: none; background: #fff; border-radius: 6px; }
dialog.zoom .close { position: fixed; top: 10px; right: 10px; background: #fff; color: #222; }
dialog.zoom .close:hover { background: #f1ebe8; }
.scrim { display: none; }
.snack { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; background: #2b2423; color: #f7efed; padding: 12px 18px; border-radius: 8px; font-size: 15px; box-shadow: var(--shadow); transition: transform .2s, opacity .2s; z-index: 60; pointer-events: none; max-width: calc(100vw - 32px); }
.snack.on { transform: translate(-50%, 0); opacity: 1; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .apparatus { position: static; border-left: 0; border-top: 1px solid var(--rule); padding: 18px 0 0; margin: 0 0 30px; }
  .apparatus dl { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 28px; }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(92vw, 380px); transform: translateX(-102%); transition: transform .22s cubic-bezier(.2, .8, .2, 1); border-radius: 0 14px 14px 0; box-shadow: var(--shadow); padding-left: env(safe-area-inset-left); visibility: hidden; }
  .app.menu .rail { transform: none; visibility: visible; }
  .app.menu .scrim { display: block; position: fixed; inset: 0; background: rgba(10, 5, 5, .4); z-index: 30; }
  .brand small { display: none; }
  .cols.two { grid-template-columns: minmax(0, 1fr); }
  .zoom-btn { opacity: 1; }
}
@media (min-width: 901px) { .menu-btn { display: none; } }
@media (max-width: 520px) {
  .band { height: 16px; }
  .player { padding: 10px; }
  .p-lbl { min-width: 0; width: 100%; }
  .sheets { padding: 10px 8px 2px; }
  .pager span { white-space: normal; }
  .home .band-lg { height: 22px; }
}
@media (pointer: coarse) { .seg button, .tbtn, .stepper { min-height: 40px; } .chip { min-height: 40px; } }
@media (prefers-reduced-motion: reduce) {

}
@media print {

  .app, .layout, .grid { display: block; height: auto; }
  .doc { overflow: visible; }
  .page { max-width: none; padding: 0; }
  .opener { margin: 0 0 3mm; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .song-title { font-size: 22pt; margin: 0 0 2mm; color: #000; }
  .song-title .no { color: #8a0f17; }
  .print-src, .print-url { display: block !important; font: 9.5pt/1.4 var(--sans); color: #444; margin: 0 0 5mm; }
  .print-url { margin: 6mm 0 0; }
  .score { box-shadow: none; border: 0; border-radius: 0; background: none; }
  .sheets { padding: 0; }
  .sheet { break-inside: avoid; margin: 0 0 3mm; }
  .refnote { background: none; padding: 0; margin: 0 0 2mm; color: #000; }
  .sec { margin: 0 0 4mm; }
  .text { font-size: 12.5pt; line-height: 1.5; max-width: none; color: #000; }
  .cols.one .text.long { columns: 2; column-gap: 10mm; }
  .ln { break-inside: avoid; }
  .notice { background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }
}

  var VOLS = [['V', 'песні любоўныя, вясельныя, сямейныя, каляндарныя, вайсковыя, балады'], ['VI', 'круцёлкі, жартоўныя песні, танцы, застольныя, розныя, хрэсьбінныя, думы']];

  // ---------- routing ----------
  function show() {
    var id = decodeURIComponent(location.hash.slice(1));
    if (id === 'likes') return;
    cur = byId[id] || null;
    if (cur && visible.indexOf(cur) < 0 && anyFilter()) {
      if (!matchGroup(cur)) st.group = 'all';
      FACETS.forEach(function (f) { if (!matchFacet(cur, f)) st.f[f.key] = ''; });
      if (!matchQuery(cur)) { st.q = ''; $('q').value = ''; $('qclear').hidden = true; }
      saveFilters(); compute(); counts(); syncUrl();
    }
    renderList();
    if (cur) renderSong(cur); else renderIntro();
    $('main').scrollTop = 0;
    document.title = cur ? '№ ' + cur.id + ' ' + cur.title.replace(/́/g, '') + ' — Мужчынскія песні' : 'Мужчынскія песні — Федароўскі, т. V–VI';
    scrollListToCur();
    closeMenu();
  }
  function go(delta) {
    if (!cur) { if (visible.length) location.hash = visible[0].id; return; }
    var i = visible.indexOf(cur) + delta;
    if (i >= 0 && i < visible.length) location.hash = visible[i].id;
  }
  function refilter() { compute(); counts(); renderList(); syncUrl(); if (cur) { var y = $('main').scrollTop; renderSong(cur); $('main').scrollTop = y; } else renderIntro(); }

    giscusSend({ setConfig: { theme: giscusTheme() } });

    var b = e.target.closest('button[data-f]'); if (b) setFacet(b.getAttribute('data-f'), b.getAttribute('data-v'));
  });
  $('facets').addEventListener('keydown', function (e) { var c = e.target.closest('[data-clear]'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); clearFacet(c.getAttribute('data-clear')); } });
  $('facets').addEventListener('toggle', function (e) { var d = e.target; if (d.matches && d.matches('details.facet')) save('open.' + d.getAttribute('data-facet'), d.open); }, true);
  var ft; $('facets').addEventListener('input', function (e) { var k = e.target.getAttribute('data-fs'); if (!k) return; fq[k] = e.target.value; clearTimeout(ft); ft = setTimeout(renderFacets, 120); });
  $('resetAll').addEventListener('click', resetAll);
  var qt; $('q').addEventListener('input', function () { var v = this.value; $('qclear').hidden = !v; clearTimeout(qt); qt = setTimeout(function () { st.q = v; refilter(); }, 120); });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter' && visible.length) { location.hash = visible[0].id; this.blur(); } });
  $('qclear').addEventListener('click', function (e) { e.preventDefault(); $('q').value = ''; this.hidden = true; st.q = ''; refilter(); $('q').focus(); });
  $('list').addEventListener('click', function (e) { if (e.target.closest('#resetF')) resetAll(); });
  $('theme').addEventListener('click', function () { st.theme = isDark() ? 'light' : 'dark'; save('theme', st.theme); applyPrefs(); });
  $('menu').addEventListener('click', openMenu);
  $('scrim').addEventListener('click', closeMenu);
  function openZoom(src) { var d = $('zoom'); d.querySelector('img').src = src; if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
  $('zoomClose').addEventListener('click', function () { $('zoom').close(); });
  $('zoom').addEventListener('click', function (e) { if (e.target === this || e.target.tagName === 'IMG') this.close(); });

  // delegated clicks inside the page
  $('view').addEventListener('click', function (e) {
    var t = e.target;
    var cb = t.closest('[data-facet-set]'); if (cb) { setFacet(cb.getAttribute('data-facet-set'), cb.getAttribute('data-value'), true); return; }
    if (t.closest('#printBtn')) { stopPlay(); window.print(); return; }
    var zb = t.closest('.zoom-btn'); if (zb) { openZoom(zb.getAttribute('data-src')); return; }
    if (t.closest('#prev')) return go(-1);
    if (t.closest('#next')) return go(1);
    if (t.closest('#toLikes')) { e.preventDefault(); var L = $('likes'); if (L) L.scrollIntoView(); return; }
    if (t.closest('#pListen')) { if (playing() && FP.mode() === 'listen') stopPlay(); else startPlay('listen'); return; }
    if (t.closest('#pLearn')) { if (playing() && FP.mode() === 'learn') stopPlay(); else startPlay('learn', 0); return; }
    var ps = t.closest('#pSet'); if (ps) { var pn = $('pPanel'); pn.hidden = !pn.hidden; ps.setAttribute('aria-expanded', !pn.hidden); save('panel', !pn.hidden); return; }
    var pi = t.closest('#pInst button'); if (pi) { FP.set('inst', pi.getAttribute('data-v')); updateUI(); return; }
    var po = t.closest('#pOct button'); if (po) { FP.set('octave', +po.getAttribute('data-v')); updateUI(); return; }
    if (t.closest('#pTrDown')) { FP.set('transpose', Math.max(-7, FP.settings.transpose - 1)); updateUI(); return; }
    if (t.closest('#pTrUp')) { FP.set('transpose', Math.min(7, FP.settings.transpose + 1)); updateUI(); return; }
    var mb = t.closest('#mode button'); if (mb) { st.mode = mb.getAttribute('data-m'); save('mode', st.mode); rerenderText(); return; }
    if (t.closest('#acc')) { st.acc = !st.acc; save('acc', st.acc); rerenderText(); return; }
    if (t.closest('#fsm')) { st.fs = Math.max(15, st.fs - 1); save('fs', st.fs); applyPrefs(); $('fsv').textContent = st.fs; return; }
    if (t.closest('#fsp')) { st.fs = Math.min(32, st.fs + 1); save('fs', st.fs); applyPrefs(); $('fsv').textContent = st.fs; return; }
    var si = t.closest('.sheet-img');
    if (si) {
      var k = +si.getAttribute('data-k');
      if (k < 0 || !P.mel || !P.mel.ev.length) { openZoom(si.querySelector('img').src); return; }
      var r = si.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      var best = -1, bd = 1e9;
      P.mel.ev.forEach(function (ev, i) {
        if (ev.img !== k || !ev.st) return;
        var sy = fy < ev.st[2] ? ev.st[2] - fy : fy > ev.st[3] ? fy - ev.st[3] : 0;
        var dd = Math.abs(ev.x - fx) + sy * 4;
        if (dd < bd) { bd = dd; best = i; }
      });
      if (best >= 0) startPlay(playing() ? FP.mode() : 'listen', best, { tone: false });
    }
  });
  function rerenderText() { var y = $('main').scrollTop; renderSong(cur); $('main').scrollTop = y; }
  $('view').addEventListener('input', function (e) {
    if (e.target.id === 'pTempo') { var tv = $('pTempoV'); if (tv) tv.textContent = '♩ = ' + Math.round(((P.song && P.song.bpm) || 84) * e.target.value / 100); return; }
    if (e.target.id !== 'pseek' || !P.mel) return;
    var v = +e.target.value; e.target.style.setProperty('--p', (v / 10) + '%');
    var i = idxAtBeat(P.mel.beats * v / 1000);
    if (playing()) startPlay(FP.mode(), i, { tone: false }); else { P.idx = i; updateUI(); }
  });
  $('view').addEventListener('change', function (e) {
    if (e.target.id === 'pDrone') { FP.set('drone', e.target.checked); updateUI(); }
    else if (e.target.id === 'pTempo') { FP.set('tempo', e.target.value / 100); updateUI(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input[type=search], input[type=text], textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape') { closeMenu(); }
    else if (e.key === 'ArrowLeft' && e.target.type !== 'range') { go(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' && e.target.type !== 'range') { go(1); e.preventDefault(); }
    else if (e.key === '/') { if (matchMedia('(max-width: 900px)').matches) openMenu(); $('q').focus(); e.preventDefault(); }
    else if ((e.key === ' ' || e.code === 'Space') && P.mel && P.mel.ev.length && !e.target.closest('button, summary, a, input')) { if (playing()) stopPlay(); else startPlay('listen'); e.preventDefault(); }
  });
  window.addEventListener('hashchange', show);
  var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyPrefs);

  if (st.q) { $('q').value = st.q; $('qclear').hidden = false; }
  applyPrefs(); compute(); counts(); show();
})();
</script>
</body>
</html>
